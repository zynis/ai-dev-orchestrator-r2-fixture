name: Orchestrator Recovery
run-name: Orchestrator recovery ${{ inputs.failed_run_id }}
on:
  workflow_dispatch:
    inputs:
      failed_run_id: {required: true, type: string}
permissions: {}
concurrency:
  group: r2-recovery-${{ inputs.failed_run_id }}
  queue: max
jobs:
  recover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions: {contents: read, issues: read, actions: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: python3 -m ai_dev_orchestrator.control_cli recover

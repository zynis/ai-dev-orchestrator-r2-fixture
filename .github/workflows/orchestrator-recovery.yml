name: R2 Recovery
on:
  workflow_run:
    workflows: [R2 Attempt]
    types: [completed]
permissions: {}
concurrency:
  group: r2-recovery-${{ github.event.workflow_run.id }}
  queue: max
jobs:
  recover:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions: {contents: read, issues: read, actions: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -m ai_dev_orchestrator.live_r2 recover
